services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: katana
      POSTGRES_USER: katana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katana -d katana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  postgres_data:
