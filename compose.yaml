services:
  bot:
    build: .
    profiles: ["bot"]
    restart: unless-stopped
    env_file: .env
    environment:
      SQLITE_PATH: /data/katana.sqlite3
      DATABASE_URL: ${KATANA_DOCKER_DATABASE_URL:-}
      REDIS_URL: ${KATANA_DOCKER_REDIS_URL:-}
      OLLAMA_URL: ${KATANA_DOCKER_OLLAMA_URL:-http://ollama:11434}
    volumes:
      - bot_data:/data

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: katana
      POSTGRES_USER: katana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katana -d katana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "127.0.0.1:6380:6379"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bot_data:
  postgres_data:
  ollama_models:
